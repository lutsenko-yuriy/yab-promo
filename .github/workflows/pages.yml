name: Pages

# Builds the deck and publishes deck/ (without its sources) to
# https://lutsenko-yuriy.github.io/yab-promo/.
on:
  push:
    branches: [main]
    paths:
      - "deck/**"
      - "tools/build_deck.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build the deck
        run: |
          python3 tools/build_deck.py
          rsync -a --exclude /src/ deck/ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
