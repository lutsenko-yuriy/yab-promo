<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.title">YAB: Yuriy's agentic boyz – presentation</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/reveal.js-6.0.2/reset.css">
  <link rel="stylesheet" href="vendor/reveal.js-6.0.2/reveal.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div class="yab-controls">
    <div class="yab-lang" role="group" data-i18n-aria="controls.language">
      <button type="button" data-lang="en" data-i18n="controls.lang-en">EN</button>
      <button type="button" data-lang="de" data-i18n="controls.lang-de">DE</button>
    </div>
    <button type="button" class="yab-fullscreen" data-i18n-aria="controls.fullscreen">
      <svg class="icon-enter" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
      </svg>
      <svg class="icon-exit" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>
      </svg>
    </button>
  </div>

  <div class="reveal">
    <div class="slides">

      <section id="toc" data-auto-animate>
        <h1 class="toc-title" data-i18n="toc.title">YAB · Yuriy's agentic boyz</h1>
        <p class="toc-tagline" data-i18n="toc.tagline"></p>
        <ol class="toc">
          <li><a href="#/purpose" class="card" data-id="toc-1">
            <span class="toc-num">1</span><span data-i18n="toc.purpose"></span>
          </a></li>
          <li><a href="#/example" class="card" data-id="toc-2">
            <span class="toc-num">2</span><span data-i18n="toc.example"></span>
          </a></li>
          <li><a href="#/cases" class="card" data-id="toc-3">
            <span class="toc-num">3</span><span data-i18n="toc.cases"></span>
          </a></li>
          <li><a href="#/limits" class="card" data-id="toc-4">
            <span class="toc-num">4</span><span data-i18n="toc.limits"></span>
          </a></li>
          <li><a href="#/get-yab" class="card" data-id="toc-5">
            <span class="toc-num">5</span><span data-i18n="toc.get-yab"></span>
          </a></li>
        </ol>
      </section>

      <section id="purpose" data-auto-animate>
        <p class="eyebrow" data-i18n="eyebrow.purpose"></p>
        <h2 class="section-title" data-id="toc-1" data-i18n="toc.purpose"></h2>
        <p class="lead" data-i18n="purpose.lead"></p>
        <ul class="points">
          <li class="fragment" data-i18n="purpose.hurry"></li>
          <li class="fragment" data-i18n="purpose.memory"></li>
          <li class="fragment" data-i18n="purpose.review"></li>
        </ul>
      </section>

      <section id="example" data-auto-animate>
        <p class="eyebrow" data-i18n="eyebrow.example"></p>
        <h2 class="section-title" data-id="toc-2" data-i18n="toc.example"></h2>
        <p class="lead" data-i18n="example.lead"></p>
        <div class="pact-chain">
          <div class="card pact">
            <span class="pact-name" data-i18n="example.old-name"></span>
            <span class="pact-status is-done" data-i18n="example.old-status"></span>
            <span class="pact-button" data-i18n="example.button"></span>
          </div>
          <div class="pact-arrow fragment" aria-hidden="true">→</div>
          <div class="card pact fragment">
            <span class="pact-name" data-i18n="example.new-name"></span>
            <span class="pact-status" data-i18n="example.new-status"></span>
            <span class="pact-link" data-i18n="example.previous"></span>
          </div>
        </div>
        <p class="note" data-i18n="example.gloss"></p>
      </section>

      <section id="cases" data-auto-animate>
        <p class="eyebrow" data-i18n="eyebrow.cases"></p>
        <h2 class="section-title" data-id="toc-3" data-i18n="toc.cases"></h2>
        <p class="lead" data-i18n="cases.lead"></p>
        <div class="cards">
          <div class="card fragment">
            <span class="card-title">Habit Loop</span>
            <span data-i18n="cases.habit-loop"></span>
          </div>
          <div class="card fragment">
            <span class="card-title">CheckLister</span>
            <span data-i18n="cases.checklister"></span>
          </div>
        </div>
        <p class="note fragment" data-i18n="cases.note"></p>
      </section>

      <section id="limits" data-auto-animate>
        <p class="eyebrow" data-i18n="eyebrow.limits"></p>
        <h2 class="section-title" data-id="toc-4" data-i18n="toc.limits"></h2>
        <p class="lead" data-i18n="limits.lead"></p>
        <ul class="points">
          <li class="fragment" data-i18n="limits.team"></li>
          <li class="fragment" data-i18n="limits.stacks"></li>
          <li class="fragment" data-i18n="limits.repos"></li>
        </ul>
      </section>

      <section id="get-yab" data-auto-animate>
        <p class="eyebrow" data-i18n="eyebrow.get-yab"></p>
        <h2 class="section-title" data-id="toc-5" data-i18n="toc.get-yab"></h2>
        <a class="big-link" href="https://github.com/lutsenko-yuriy/yuriys-agentic-boyz"
           target="_blank" rel="noopener">github.com/lutsenko-yuriy/yuriys-agentic-boyz</a>
        <ol class="steps">
          <li class="fragment" data-i18n="get-yab.template"></li>
          <li class="fragment" data-i18n="get-yab.open"></li>
          <li class="fragment" data-i18n="get-yab.onboard"></li>
        </ol>
        <p class="thanks fragment" data-i18n="get-yab.thanks"></p>
      </section>

    </div>
  </div>

  <script src="vendor/reveal.js-6.0.2/reveal.js"></script>
  <script src="i18n/en.js"></script>
  <script src="i18n/de.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/deck.js"></script>
</body>
</html>
