<div class="switch-panel" data-id="switch-panel">
  <p class="toggle{{click-class}}" data-id="toggle"{{click-index}}><span class="toggle-knob" data-id="toggle-knob"></span><span class="toggle-label toggle-off" data-id="toggle-off" data-i18n="switch.off"></span><span class="toggle-label toggle-on" data-id="toggle-on" data-i18n="switch.on"></span></p>
  <p class="switch-name" data-id="switch-name" data-i18n="switch.name"></p>
  <ul class="switch-purpose" data-id="switch-purpose"><li data-id="purpose-ships" data-i18n="switch.purpose-ships"></li><li class="purpose-on{{click-class}}" data-id="purpose-on"{{click-index}}><span class="purpose-pending" data-id="purpose-pending" data-i18n="switch.purpose-pending"></span><span class="purpose-released" data-id="purpose-released" data-i18n="switch.purpose-released"></span></li><li data-id="purpose-off" data-i18n="switch.purpose-off"></li></ul>
</div>
