<ol class="wu-track{{track-class}}" data-id="track"{{track-hidden}}>
  <li class="wu-chip is-step{{state-brief}}"{{current-brief}} data-id="step-brief"><span class="wu-name">Brief</span>{{done-brief}}</li>
  <li class="wu-chip is-step{{state-analyze}}"{{current-analyze}} data-id="step-analyze"><span class="wu-name">Analyze</span>{{done-analyze}}</li>
  <li class="wu-chip is-step{{state-plan}}"{{current-plan}} data-id="step-plan"><span class="wu-name">Plan</span>{{done-plan}}</li>
</ol>
